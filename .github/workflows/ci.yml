# Checks pull requests. Runs without secrets, so it is safe for pull requests
# from forks: the app builds against the offline Firebase placeholder.
name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Use the offline Firebase placeholder
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
