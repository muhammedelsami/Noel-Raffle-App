# Builds a signed app bundle and uploads it to Google Play:
#   push to dev  -> internal testing track, store listing only validated
#   push to main -> production track, store listing updated
# The listing comes from Production/metadata/android (fastlane supply layout).
#
# Versions are set from the run number, so nothing is committed back:
#   versionCode = VERSION_CODE_OFFSET + run number
#   versionName = <major>.<minor> from pubspec.yaml + "." + run number
# Raise major/minor by editing `version:` in pubspec.yaml.
#
# Secrets live in the `play-store` environment, which only the dev and main
# branches can use. See README, "Continuous delivery".
name: Release

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.9
  PACKAGE_NAME: com.muhammed.noel_raffle
  # Highest versionCode uploaded before this workflow existed (2.0.0+9).
  VERSION_CODE_OFFSET: 9

jobs:
  release:
    runs-on: ubuntu-latest
    environment: play-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check secrets
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in PLAY_SERVICE_ACCOUNT_JSON FIREBASE_OPTIONS_DART GOOGLE_SERVICES_JSON \
              ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the play-store environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Compute version
        id: version
        run: |
          base=$(sed -n 's/^version: *\([0-9]*\.[0-9]*\)\..*/\1/p' pubspec.yaml)
          name="$base.$GITHUB_RUN_NUMBER"
          code=$((VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $name ($code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Firebase config
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build app bundle
        run: >-
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}

      - name: Collect release notes
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          for dir in Production/metadata/android/*/; do
            language=$(basename "$dir")
            notes="$dir/changelogs/default.txt"
            if [ -f "$notes" ]; then
              cp "$notes" "$RUNNER_TEMP/whatsnew/whatsnew-$language"
            fi
          done

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ github.ref_name == 'main' && 'production' || 'internal' }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      # The store listing (texts, icon, feature graphic, screenshots) comes from
      # Production/metadata/android. main publishes it; dev only validates it, so
      # a broken listing shows up before it reaches main. Unchanged images are
      # skipped; release notes are handled by the upload above.
      - name: Install fastlane
        run: sudo gem install fastlane --version 2.240.1 --no-document

      - name: Update store listing
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SUPPLY_PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          SUPPLY_METADATA_PATH: Production/metadata/android
          SUPPLY_SKIP_UPLOAD_APK: 'true'
          SUPPLY_SKIP_UPLOAD_AAB: 'true'
          SUPPLY_SKIP_UPLOAD_CHANGELOGS: 'true'
          SUPPLY_SYNC_IMAGE_UPLOAD: 'true'
          SUPPLY_VALIDATE_ONLY: ${{ github.ref_name == 'main' && 'false' || 'true' }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
        run: fastlane supply
