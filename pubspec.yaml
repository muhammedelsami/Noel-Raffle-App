name: noel_raffle
description: "Noel Raffle — modern, kurumsal yılbaşı ve hediye çekilişi uygulaması."
# Prevents accidental publishing to pub.dev.
publish_to: 'none'

version: 2.0.0+9

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization (TR / EN / AR)
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.2

  # State management & clean architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Local persistence (theme, language, raffle history)
  shared_preferences: ^2.2.3

  # Optional online features (Firebase free Spark plan)
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0

  # UI & platform helpers
  confetti: ^0.7.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.9.2
  # Encodes the Play Store artwork (Production/tool/store_assets.dart).
  image: ^3.3.0
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2

# App icons are rendered from the in-app BrandMark painter.
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icons/app_icon.png"
  adaptive_icon_background: "icons/app_icon_background.png"
  adaptive_icon_foreground: "icons/app_icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/gift-raffle.png
    - assets/images/gift-hand.png
    - assets/fonts/Alexandria-OFL.txt

  fonts:
    # Google Fonts "Alexandria", bundled so it works offline: a variable font
    # (wght 100–900) with Latin, Turkish and Arabic glyphs.
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria.ttf
